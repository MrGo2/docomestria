[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docomestria"
version = "0.7.0"
description = "Fuse LiteParse v2, Docling, and pdfplumber for richer PDF extraction with semantic and visual layout awareness"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Carlos Lorenzo", email = "carlos@edelwyss.es" },
]
keywords = ["pdf", "extraction", "docling", "liteparse", "pdfplumber", "layout", "ocr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "liteparse>=2.0.5,<3",
    "docling>=2.97,<3",
    "pdfplumber>=0.11.9,<1",
    "scikit-learn>=1.7.2",
    "pandas>=2.3.3",
]

[project.optional-dependencies]
stats = [
    "scikit-learn>=1.3,<2",
]
llm = [
    "rapidfuzz>=3.14,<4",
]
transform = [
    "python-dateutil>=2.9,<3",
    "python-stdnum>=2.2,<3",
    "babel>=2.18,<3",
    "phonenumbers>=9.0,<10",
]
pipeline = [
    "diskcache>=5.6.3,<6",
]
gemini = [
    "google-genai>=2.8,<3",
]
claude = [
    "anthropic>=0.105,<1",
]
openai = [
    "openai>=2.41,<3",
]
openrouter = [
    "openai>=2.41,<3",
]
dev = [
    "pytest>=9.0,<10",
    "ruff>=0.15,<0.16",
    "pre-commit>=4.6,<5",
    "reportlab>=4.5,<5",
    "rapidfuzz>=3.14,<4",
    "python-dateutil>=2.9,<3",
    "python-stdnum>=2.2,<3",
    "babel>=2.18,<3",
    "phonenumbers>=9.0,<10",
    "diskcache>=5.6.3,<6",
    "openai>=2.41,<3",
    "scikit-learn>=1.3,<2",
]

[project.urls]
Homepage = "https://github.com/MrGo2/docomestria"
Repository = "https://github.com/MrGo2/docomestria"
Issues = "https://github.com/MrGo2/docomestria/issues"
Changelog = "https://github.com/MrGo2/docomestria/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/docomestria"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["src"]
