name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install lightweight test deps
        # Heavy upstream engines (Docling pulls torch) are NOT installed in CI.
        # The default test suite exercises geometry, models, fusion logic, and
        # pairing — none of which import the engines at module load time.
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Run tests
        # Make `src/docomestria` importable without installing the package
        # (so we avoid pulling Docling/torch into CI).
        env:
          PYTHONPATH: src
        run: pytest -ra
